<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — DataFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body class="dashboard-body">
    <main class="dashboard-main">
        <header class="dashboard-header">
            <span class="page-overline">DASHBOARD</span>
            <h1>Dashboard</h1>
            <p>Área reservada para as visualizações geradas a partir dos dados importados.</p>
        </header>
        <section id="dashboardWorkspace" class="dashboard-workspace">
            <div class="empty-state">
                <i class="bi bi-bar-chart-line"></i>
                <h2>Nenhuma análise configurada</h2>
                <p>Importe um conjunto de dados para começar a montar seu dashboard.</p>
                <a href="datasets.html" class="btn btn-primary-custom">Importar dados</a>
            </div>
        </section>
    </main>
</body>
</html>
