<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatórios — DataFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body class="dashboard-body">
    <main class="dashboard-main">
        <header class="dashboard-header">
            <span class="page-overline">RELATÓRIOS</span>
            <h1>Relatórios</h1>
            <p>Área reservada para relatórios gerados a partir das análises.</p>
        </header>
        <section id="reportsWorkspace" class="dashboard-workspace">
            <div class="empty-state">
                <i class="bi bi-file-earmark-bar-graph"></i>
                <h2>Nenhum relatório disponível</h2>
                <p>Os relatórios serão disponibilizados depois que uma análise for configurada.</p>
                <a href="datasets.html" class="btn btn-primary-custom">Importar dados</a>
            </div>
        </section>
    </main>
</body>
</html>
