<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Comparar — DataFlow</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">

</head>

<body class="dashboard-body">

<div class="dashboard-wrapper">

    <aside class="sidebar">

        <div class="sidebar-brand">

            <div class="brand-icon">
                <i class="bi bi-bar-chart-fill"></i>
            </div>

            <span>
                Data<span class="brand-highlight">Flow</span>
            </span>

        </div>


        <nav class="sidebar-nav">

            <span class="sidebar-label">MENU</span>

            <a href="dashboard.html" class="sidebar-link">
                <i class="bi bi-grid-1x2-fill"></i>
                <span>Visão geral</span>
            </a>

            <a href="datasets.html" class="sidebar-link">
                <i class="bi bi-database-fill"></i>
                <span>Meus dados</span>
            </a>

            <a href="comparison.html" class="sidebar-link active">
                <i class="bi bi-arrow-left-right"></i>
                <span>Comparar</span>
            </a>

            <a href="reports.html" class="sidebar-link">
                <i class="bi bi-file-earmark-bar-graph-fill"></i>
                <span>Relatórios</span>
            </a>

        </nav>

    </aside>


    <main class="dashboard-main">

        <header class="dashboard-header">

            <div>

                <span class="page-overline">
                    ANÁLISE
                </span>

                <h1>
                    Comparar dados
                </h1>

                <p>
                    Compare diferentes conjuntos de informações.
                </p>

            </div>

        </header>


        <section class="dashboard-card comparison-config">

            <div class="comparison-column">

                <div class="comparison-heading">
                    <span class="comparison-number">01</span>

                    <div>
                        <small>PRIMEIRO CONJUNTO</small>
                        <h3>Dados A</h3>
                    </div>
                </div>


                <label class="form-label">
                    Conjunto de dados
                </label>

                <select class="form-select" id="datasetA">
                    <option value="">Selecione...</option>
                </select>

            </div>


            <div class="comparison-divider">
                <span>VS</span>
            </div>


            <div class="comparison-column">

                <div class="comparison-heading">
                    <span class="comparison-number">02</span>

                    <div>
                        <small>SEGUNDO CONJUNTO</small>
                        <h3>Dados B</h3>
                    </div>
                </div>


                <label class="form-label">
                    Conjunto de dados
                </label>

                <select class="form-select" id="datasetB">
                    <option value="">Selecione...</option>
                </select>

            </div>


            <div class="comparison-options">

                <label class="form-label">
                    Métrica para comparação
                </label>

                <select class="form-select" id="comparisonMetric">

                    <option value="value">
                        Valor
                    </option>

                    <option value="average">
                        Média
                    </option>

                    <option value="total">
                        Total
                    </option>

                </select>


                <button
                    class="btn btn-primary-custom mt-4"
                    id="compareButton">

                    <i class="bi bi-bar-chart-line"></i>
                    Comparar dados

                </button>

            </div>

        </section>


        <section
            class="dashboard-card comparison-result mt-4"
            id="comparisonResult"
            style="display:none;">

            <div class="card-header-custom">

                <div>

                    <span class="card-label">
                        RESULTADO
                    </span>

                    <h2>
                        Comparação
                    </h2>

                </div>

            </div>


            <div class="comparison-metrics">

                <div class="comparison-metric-card">

                    <span>Dados A</span>

                    <strong id="comparisonValueA">
                        —
                    </strong>

                </div>


                <div class="comparison-vs">
                    VS
                </div>


                <div class="comparison-metric-card">

                    <span>Dados B</span>

                    <strong id="comparisonValueB">
                        —
                    </strong>

                </div>


                <div class="comparison-difference">

                    <span>Variação</span>

                    <strong id="comparisonDifference">
                        —
                    </strong>

                </div>

            </div>


            <div class="chart-container mt-5">

                <canvas id="comparisonResultChart"></canvas>

            </div>

        </section>

    </main>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script src="js/storage.js"></script>
<script src="js/charts.js"></script>
<script src="js/comparison.js"></script>
<script src="js/app.js"></script>

</body>
</html>
