<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meus dados — DataFlow</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">

</head>

<body class="dashboard-body">

<div class="dashboard-wrapper">

    <aside class="sidebar">

        <div class="sidebar-brand">

            <div class="brand-icon">
                <i class="bi bi-bar-chart-fill"></i>
            </div>

            <span>
                Data<span class="brand-highlight">Flow</span>
            </span>

        </div>


        <nav class="sidebar-nav">

            <span class="sidebar-label">MENU</span>

            <a href="dashboard.html" class="sidebar-link">
                <i class="bi bi-grid-1x2-fill"></i>
                <span>Visão geral</span>
            </a>

            <a href="datasets.html" class="sidebar-link active">
                <i class="bi bi-database-fill"></i>
                <span>Meus dados</span>
            </a>

            <a href="comparison.html" class="sidebar-link">
                <i class="bi bi-arrow-left-right"></i>
                <span>Comparar</span>
            </a>

            <a href="reports.html" class="sidebar-link">
                <i class="bi bi-file-earmark-bar-graph-fill"></i>
                <span>Relatórios</span>
            </a>

        </nav>

    </aside>


    <main class="dashboard-main">

        <header class="dashboard-header">

            <div>

                <span class="page-overline">
                    DADOS
                </span>

                <h1>
                    Meus conjuntos
                </h1>

                <p>
                    Gerencie e organize seus conjuntos de dados.
                </p>

            </div>

            <button class="btn btn-primary-custom" data-bs-toggle="modal" data-bs-target="#datasetModal">
                <i class="bi bi-plus-lg"></i>
                Novo conjunto
            </button>

        </header>


        <section class="dashboard-card">

            <div class="table-responsive">

                <table class="table dataflow-table">

                    <thead>

                        <tr>
                            <th>Nome</th>
                            <th>Registros</th>
                            <th>Colunas</th>
                            <th>Atualizado</th>
                            <th>Status</th>
                            <th></th>
                        </tr>

                    </thead>

                    <tbody id="datasetTable">

                    </tbody>

                </table>

            </div>

        </section>

    </main>

</div>


<div class="modal fade" id="datasetModal" tabindex="-1">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content dataflow-modal">

            <div class="modal-header">

                <h5 class="modal-title">
                    Novo conjunto de dados
                </h5>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                </button>

            </div>


            <div class="modal-body">

                <label class="form-label">
                    Nome do conjunto
                </label>

                <input
                    type="text"
                    id="datasetName"
                    class="form-control"
                    placeholder="Ex.: Vendas 2026"
                >


                <label class="form-label mt-3">
                    Descrição
                </label>

                <textarea
                    id="datasetDescription"
                    class="form-control"
                    rows="3"
                    placeholder="Descreva seus dados..."
                ></textarea>


                <div class="dataset-import-options mt-4">

                    <button class="import-option" id="manualDataButton">

                        <i class="bi bi-pencil-square"></i>

                        <strong>Inserir manualmente</strong>

                        <small>
                            Crie sua própria tabela
                        </small>

                    </button>


                    <label class="import-option">

                        <i class="bi bi-filetype-csv"></i>

                        <strong>Importar CSV</strong>

                        <small>
                            Carregue um arquivo
                        </small>

                        <input
                            type="file"
                            id="csvFile"
                            accept=".csv"
                            hidden
                        >

                    </label>

                </div>

            </div>


            <div class="modal-footer">

                <button class="btn btn-light" data-bs-dismiss="modal">
                    Cancelar
                </button>

                <button class="btn btn-primary-custom" id="createDataset">
                    Criar conjunto
                </button>

            </div>

        </div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.3/papaparse.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script src="js/storage.js"></script>
<script src="js/datasets.js"></script>
<script src="js/app.js"></script>

</body>
</html>
